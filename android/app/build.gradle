plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.example.app"
        // dispatchGesture (المرحلة 1) يتطلب API 24 كحد أدنى
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            // للتجربة فقط — أنشئ مفتاح توقيع خاص قبل النشر على المتجر
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    // ═══ المرحلة 2: Shizuku API (متاحة على Maven Central) ═══
    implementation 'rikka.shizuku:api:13.1.5'
    implementation 'rikka.shizuku:provider:13.1.5'
}
