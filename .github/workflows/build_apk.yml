name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      # المشروع يرفع ملفاته المخصصة فقط (Kotlin/Dart/Gradle) —
      # هذا يولّد الملفات المولدة تلقائياً الناقصة: gradle wrapper،
      # الأيقونات الافتراضية، local.properties ... إلخ دون مس الموجود.
      - name: Generate missing platform files
        run: |
          flutter create --platforms android --project-name agent_automation .
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Show APK info
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-automation-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-automation-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Prepare GitHub Release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk agent-automation-v1.1.1.apk

      - name: Publish GitHub Release v1.1.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: 🤖 وكيل الأتمتة الذكي v1.1.1
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: agent-automation-v1.1.1.apk
          body: |
            توقيع ثابت (keystore المشروع) + Gemini عبر REST v1 / gemini-1.5-flash.

            - 🔐 موقّع بمفتاح إصدار ثابت — التحديثات القادمة تُثبَّت فوق هذه النسخة دون حذف
            - 🤖 Gemini: /v1/models/gemini-1.5-flash:generateContent مع إظهار خطأ Google الأصلي
            - 🎙️ استماع دائم + اسم نداء مخصص + رد صوتي رجالي
            - ⌨️ شات أوامر عربية (نص وصوت) — الحوار العام يذهب إلى Gemini
            - 📡 Shizuku + نافذة عائمة + المساعد الافتراضي

            **التثبيت فوق v1.0.0:** إن رفض النظام التحديث (اختلاف التوقيع القديم من CI) احذف النسخة الأولى مرة واحدة ثم ثبّت v1.1.1. بعدها أي إصدار جديد يُثبَّت فوقها مباشرة.

            **التفعيل:** إمكانية الوصول ← «محرك الأتمتة» • Shizuku • مفتاح Gemini من ⚙️.
