name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      # المشروع يرفع ملفاته المخصصة فقط (Kotlin/Dart/Gradle) —
      # هذا يولّد الملفات المولدة تلقائياً الناقصة: gradle wrapper،
      # الأيقونات الافتراضية، local.properties ... إلخ دون مس الموجود.
      - name: Generate missing platform files
        run: |
          flutter create --platforms android --project-name agent_automation .
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Show APK info
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-automation-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-automation-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Prepare GitHub Release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk agent-automation-v1.2.0.apk

      - name: Publish GitHub Release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: 🤖 وكيل الأتمتة الذكي v1.2.0
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          files: agent-automation-v1.2.0.apk
          body: |
            مزودو الذكاء الاصطناعي المتوافقون مع OpenAI + إصلاح قائمة المساعد الرقمي.

            - 🧠 Groq (افتراضي) / OpenRouter / OpenAI / DeepSeek / Custom من ⚙️
            - 🔐 توقيع ثابت — يُثبَّت فوق v1.1.1 دون حذف
            - 🎙️ VoiceInteractionService + RecognitionService ليظهر في المساعد الرقمي
            - 📡 Shizuku + نافذة عائمة

            **التفعيل:** ⚙️ ← اختر المزود وأدخل المفتاح • إمكانية الوصول ← «محرك الأتمتة».
