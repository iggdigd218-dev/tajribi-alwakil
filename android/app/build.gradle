plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        agent {
            storeFile file("keystore/agent-release.jks")
            storePassword "AgentAuto2026"
            keyAlias "agent"
            keyPassword "AgentAuto2026"
        }
    }

    defaultConfig {
        applicationId = "com.example.app"
        // dispatchGesture (المرحلة 1) يتطلب API 24 كحد أدنى
        minSdk = 24
        targetSdk = 34
        versionCode = 3
        versionName = "1.1.1"
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.agent
        }
        release {
            signingConfig = signingConfigs.agent
        }
    }
}

dependencies {
    // ═══ المرحلة 2: Shizuku API ═══
    // ⚠️ المجموعة الرسمية على Maven Central هي dev.rikka.shizuku
    //    (اسم حزمة Kotlin يبقى rikka.shizuku كما هو)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
