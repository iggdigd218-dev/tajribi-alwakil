name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      # المشروع يرفع ملفاته المخصصة فقط (Kotlin/Dart/Gradle) —
      # هذا يولّد الملفات المولدة تلقائياً الناقصة: gradle wrapper،
      # الأيقونات الافتراضية، local.properties ... إلخ دون مس الموجود.
      - name: Generate missing platform files
        run: |
          flutter create --platforms android --project-name agent_automation .
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Show APK info
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-automation-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90
