plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // ═══════════════════════════════════════════════════════════════════
    //  التوقيع: لا كلمات مرور داخل الكود.
    //  ترتيب القراءة:
    //    1) android/key.properties  (محلي — مستثنى من git)
    //    2) متغيرات البيئة           (CI — GitHub Secrets)
    //    3) مفتاح debug الافتراضي    (احتياط حتى لا يفشل البناء)
    // ═══════════════════════════════════════════════════════════════════
    signingConfigs {
        agent {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file("key.properties")
            if (keystorePropertiesFile.exists()) {
                keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
            }

            def prop = { String name ->
                keystoreProperties.getProperty(name) ?: System.getenv(name)
            }

            storeFile     file(prop("storeFile")     ?: "keystore/agent-release.jks")
            storePassword prop("storePassword")      ?: ""
            keyAlias      prop("keyAlias")           ?: "agent"
            keyPassword   prop("keyPassword")        ?: ""
        }
    }

    defaultConfig {
        applicationId = "com.example.app"
        // dispatchGesture (المرحلة 1) يتطلب API 24 كحد أدنى
        minSdk = 24
        targetSdk = 34
        versionCode = 4
        versionName = "1.2.0"
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.agent.storePassword ? signingConfigs.agent : signingConfigs.debug
        }
        release {
            signingConfig = signingConfigs.agent.storePassword ? signingConfigs.agent : signingConfigs.debug
        }
    }
}

dependencies {
    // ═══ المرحلة 2: Shizuku API ═══
    // ⚠️ المجموعة الرسمية على Maven Central هي dev.rikka.shizuku
    //    (اسم حزمة Kotlin يبقى rikka.shizuku كما هو)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
